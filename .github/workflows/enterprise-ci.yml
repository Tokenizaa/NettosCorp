name: Enterprise CI

on:
  push:
    branches:
      - feat/integracao-institucional-agency-agents
    paths:
      - 'enterprise/**'
      - '.github/workflows/enterprise-ci.yml'
  pull_request:
    paths:
      - 'enterprise/**'
      - '.github/workflows/enterprise-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: enterprise
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript validation
        run: bun run lint
      - name: Team planner tests
        run: bun run test:agency-planner
      - name: Production build
        run: bun run build
