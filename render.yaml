# Render Blueprint — NettosCorp: Paperclip + Hermes (plano gratuito, US$ 0)
#
# Implanta um único Web Service gratuito no Render contendo:
#   - Paperclip (control plane, API Express) na porta $PORT
#   - Hermes (agente/gateway) como processo background no mesmo container
#
# Persistencia ($0, sem expiracao de 30 dias):
#   - Paperclip: Supabase PostgreSQL (projeto pakzvwpldlkvvdnqgdgq) via DATABASE_URL
#   - Hermes: estado em ~/.hermes/ (efemero no plano free do Render — veja LIMITACOES.md)
#
# Health check: GET /api/liveness (sem SQL, sem auth — ideal para keepalive externo)
# Auto-deploy: Render conecta ao repositorio GitHub e redeploya em push para master.
#
# Instrucoes:
#   1. Conecte o repositorio https://github.com/Tokenizaa/NettosCorp.git ao Render
#   2. Use este render.yaml como blueprint (ou crie o Web Service manualmente com
#      os mesmos comandos de build/start e variaveis de ambiente)
#   3. Defina DATABASE_URL (Supabase) e HERMES_* segredos no dashboard do Render
#      (NUNCA no repositorio)
#
# Limite do plano free: 750 instance-horas/mes, spin-down apos 15 min ocioso,
# filesystem efemero, 1 Postgres free por workspace (expira em 30 dias — nao usamos).

services:
  - type: web
    name: nettoscorp-paperclip-hermes
    env: node
    region: ohio  # ou mais proxima de voce
    plan: free
    # Root directory onde esta o pnpm-workspace.yaml do Paperclip
    rootDir: paperclip
    # Build: instala dependencias e constroi o servidor Paperclip
    buildCommand: pnpm install && pnpm --filter @paperclipai/server build
    # Start: roda Paperclip + Hermes juntos. Porta $PORT injetada pelo Render.
    startCommand: bash scripts/render-start.sh
    # Health check usado pelo Render para determinar se o servico esta vivo
    healthCheckPath: /api/liveness
    # Variaveis de ambiente (valores reais sao definidos no dashboard do Render,
    # nunca neste arquivo nem no repositorio)
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_MIGRATION_URL
        sync: false
      - key: PAPERCLIP_MIGRATION_AUTO_APPLY
        value: "true"
      - key: PAPERCLIP_MIGRATION_PROMPT
        value: "never"
      - key: SERVE_UI
        value: "false"
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: PAPERCLIP_TOOL_ACTION_SIGNING_SECRET
        sync: false
      # Hermes
      - key: HERMES_HOME
        value: /opt/render/.hermes
      - key: RENDER_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
